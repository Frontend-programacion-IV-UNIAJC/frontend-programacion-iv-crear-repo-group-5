name: Publicar en GitHub Pages

on:
    push:
        branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
    construir:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            
            # 1. Configuramos Node.js (reemplaza a withastro/checkout)
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: 'npm' # Opcional: si usas npm, ayuda a acelerar la instalación

            # 2. Instalamos las dependencias del proyecto
            - name: Instalar dependencias
              run: npm install

            # 3. Compilamos el proyecto de Astro (genera la carpeta dist)
            - name: Construir proyecto
              run: npm run build

            # 4. Subimos los archivos generados para que el siguiente trabajo los pueda publicar
            - name: Subir artefacto
              uses: actions/upload-pages-artifact@v3
              with:
                path: ./dist

    publicar:
        needs: construir
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Desplegar en GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4